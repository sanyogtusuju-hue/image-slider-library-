
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Image Slider Library</title>

  <!-- Connect CSS file -->
  <link rel="stylesheet" href="./style.css">

  <!-- Connect JavaScript file -->
  <script src="./slider.js" defer></script>
</head>

<body>
  <main class="page">
    <h1>Image Slider Library</h1>
    <p class="intro">Explore beautiful landscapes around the world.</p>

    <section class="slider" data-slider aria-label="Image slider">

      <!-- Image display area -->
      <div class="slider__viewport">
        <div class="slider__track">

          <!-- Picture 1 -->
          <div class="slider__slide">
            <img
              src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=80"
              alt="Mountain landscape"
              fetchpriority="high"
              onerror="this.alt='Mountain image unavailable';">
          </div>

          <!-- Picture 2 -->
          <div class="slider__slide">
            <img
              src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1200&q=80"
              alt="Lake surrounded by mountains"
              loading="lazy"
              onerror="this.alt='Lake image unavailable';">
          </div>

          <!-- Picture 3 -->
          <div class="slider__slide">
            <img
              src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1200&q=80"
              alt="Beautiful mountain lake"
              loading="lazy"
              onerror="this.alt='Mountain lake image unavailable';">
          </div>

          <!-- Picture 4 -->
          <div class="slider__slide">
            <img
              src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1200&q=80"
              alt="Snowy mountain peaks"
              loading="lazy"
              onerror="this.alt='Snowy mountain image unavailable';">
          </div>

        </div>
      </div>

      <!-- Previous and next buttons -->
      <button
        class="slider__arrow slider__prev"
        type="button"
        data-prev
        aria-label="Previous image">
        ❮
      </button>

      <button
        class="slider__arrow slider__next"
        type="button"
        data-next
        aria-label="Next image">
        ❯
      </button>

      <!-- Navigation dots -->
      <div class="slider__dots" data-dots></div>

      <!-- Image counter -->
      <p class="slider__status" data-status aria-live="polite">
        Image 1 of 4
      </p>

    </section>
  </main>
</body>
</html>
